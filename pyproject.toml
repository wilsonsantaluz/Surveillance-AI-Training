[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "surveillance-ai-training"
version = "0.1.0"
description = "Reproducible computer-vision training and experiment tracking foundation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
dependencies = [
    "mlflow>=3.18,<4",
    "numpy>=2.0,<3",
    "Pillow>=11,<14",
    "PyYAML>=6,<7",
    "torch>=2.14,<2.16",
    "torchvision>=0.29,<0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<3",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
surveillance-ml = "surveillance_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/surveillance_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["surveillance_ml"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true


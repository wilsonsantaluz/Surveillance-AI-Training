[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "surveillance-ai-training"
version = "0.1.0"
description = "Reproducible computer-vision training and experiment tracking foundation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.0,<3",
    "Pillow>=11,<14",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
training = [
    "mlflow>=3.18,<4",
    "torch>=2.14,<2.16",
    "torchvision>=0.29,<0.30",
]
mlops = [
    "dvc>=3.60,<4",
    "matplotlib>=3.9,<4",
    "mlflow>=3.18,<4",
    "optuna>=4.5,<6",
]
inference = [
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
]
api = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]
dev = [
    "dvc>=3.60,<4",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "matplotlib>=3.9,<4",
    "mlflow>=3.18,<4",
    "mypy>=1.15,<3",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
    "optuna>=4.5,<6",
    "pytest>=8.3,<10",
    "python-multipart>=0.0.20,<1",
    "ruff>=0.11,<1",
    "torch>=2.14,<2.16",
    "torchvision>=0.29,<0.30",
    "ultralytics>=8.3,<9",
    "uvicorn>=0.34,<1",
]
detection = [
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
    "ultralytics>=8.3,<9",
]

[project.scripts]
surveillance-ml = "surveillance_ml.cli:main"
surveillance-ml-export-onnx = "surveillance_ml.deployment.cli:export_main"
surveillance-ml-benchmark-onnx = "surveillance_ml.deployment.cli:benchmark_main"
surveillance-ml-serve = "surveillance_ml.deployment.cli:serve_main"

[tool.hatch.build.targets.wheel]
packages = ["src/surveillance_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["surveillance_ml"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true


dataset:
  root: data/demo
  samples_per_class: 24
  image_size: 64
  seed: 42
  imbalance_ratio: 1.5

training:
  output_dir: artifacts/dvc/classifier
  seed: 42
  batch_size: 12
  epochs: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adamw

model:
  strategy: head

detection:
  dataset:
    root: data/detection-demo
    source_count: 12
    image_size: 128
    seed: 42
    imbalance_threshold: 1.5
  training:
    output_dir: artifacts/detection-demo/train
  evaluation:
    output: artifacts/dvc/detection/evaluation.json
  export:
    output_dir: artifacts/dvc/detection/onnx

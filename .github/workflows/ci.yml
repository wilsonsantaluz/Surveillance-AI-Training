name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore dotnet/Inference/Inference.csproj --locked-mode
      - run: dotnet build dotnet/Inference/Inference.csproj --configuration Release --no-restore
      - run: dotnet restore dotnet/Detector.Tests/Detector.Tests.csproj --locked-mode
      - run: dotnet build dotnet/Detector.Tests/Detector.Tests.csproj --configuration Release --no-restore
      - run: dotnet test dotnet/Detector.Tests/Detector.Tests.csproj --configuration Release --no-build --no-restore

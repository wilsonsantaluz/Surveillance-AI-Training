dataset:
  root: data/detection
  version: user-supplied

model:
  architecture: yolo11n
  pretrained: true

training:
  output_dir: artifacts/detection/train
  image_size: 640
  epochs: 80
  batch_size: 8
  learning_rate: 0.001
  optimizer: AdamW
  patience: 15
  seed: 42
  device: auto
  workers: 4
  cpu_threads: 4
  mixed_precision: true

evaluation:
  confidence_threshold: 0.25
  metric_confidence_threshold: 0.001
  nms_iou_threshold: 0.7
  max_detections: 300

tracking:
  uri: sqlite:///mlflow.db
  experiment_name: surveillance-detection

export:
  model_id: surveillance-detection
  version: v1
  opset: 17

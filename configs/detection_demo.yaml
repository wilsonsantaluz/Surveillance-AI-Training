dataset:
  root: data/detection-demo
  version: synthetic-geometric-v1

model:
  architecture: yolo11n
  pretrained: false

training:
  output_dir: artifacts/detection-demo/train
  image_size: 128
  epochs: 1
  batch_size: 4
  learning_rate: 0.001
  optimizer: AdamW
  patience: 2
  seed: 42
  device: cpu
  workers: 0
  cpu_threads: 1
  mixed_precision: false

evaluation:
  confidence_threshold: 0.25
  metric_confidence_threshold: 0.001
  nms_iou_threshold: 0.7
  max_detections: 300

tracking:
  uri: sqlite:///mlflow.db
  experiment_name: surveillance-detection-demo

export:
  model_id: surveillance-detection
  version: synthetic-demo-v1
  opset: 17
